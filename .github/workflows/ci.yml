name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: ruff check src app tests
      - name: Flake8
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503 src app tests
      - name: Pytest
        run: pytest -q
